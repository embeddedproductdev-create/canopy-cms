name: Deploy CMS to Cloudflare

on:
  workflow_dispatch:
    inputs:
      replace_database:
        description: Replace the remote D1 content with seed/db-dump.sql (admin users and form submissions are kept)
        required: true
        default: true
        type: boolean
      upload_media:
        description: Upload seed/media/* to the R2 bucket
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-cms
  cancel-in-progress: false

env:
  MAX_WORKER_MB: 10.0

jobs:
  deploy:
    name: Build & Deploy Worker
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      CMS_URL: ${{ secrets.CMS_URL }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
      NOTIFY_ADMIN_URL: ${{ secrets.NOTIFY_ADMIN_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        run: |
          set -euo pipefail
          fail=0
          for name in CMS_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAYLOAD_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

          echo "--- Token identity and scopes ---"
          npx wrangler whoami

      - name: Check the admin import map is up to date
        run: |
          npm run generate:importmap
          git diff --exit-code -- 'src/app/(payload)/admin/importMap.js'

      - name: Type-check
        run: npx tsc --noEmit

      - name: Record D1 point-in-time restore bookmark
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info canopy-cms-db
          echo "To roll the database back: npx wrangler d1 time-travel restore canopy-cms-db --timestamp=<ISO time from above>"

      - name: Replace remote database content with the seed
        if: ${{ inputs.replace_database }}
        run: npm run replace:db -- --yes

      - name: Create R2 bucket if missing
        if: ${{ inputs.upload_media }}
        run: |
          set -euo pipefail
          bucket=$(node -e 'const c=require("fs").readFileSync("wrangler.jsonc","utf8");console.log(JSON.parse(c).r2_buckets[0].bucket_name)')
          if npx wrangler r2 bucket list | grep -q "$bucket"; then
            echo "Bucket $bucket exists."
          else
            npx wrangler r2 bucket create "$bucket"
          fi

      - name: Upload media to R2
        if: ${{ inputs.upload_media }}
        env:
          SYNC_MEDIA_DIR: seed/media
        run: npm run sync:media -- --yes

      - name: Apply pending content migrations to the remote database
        run: npm run apply:cleanup

      - name: Check the CMS guide is up to date
        run: |
          npm run docs:cms
          git diff --exit-code -- CMS-GUIDE.md
          npm run docs:content
          git diff --exit-code -- CONTENT-MAP.md

      - name: Verify remote migrations and content
        run: npm run verify:remote

      - name: Build application for Cloudflare
        run: npm run build:cf

      - name: Check compressed Worker size
        run: |
          set -euo pipefail
          HANDLER_PATH=".open-next/server-functions/default/handler.mjs"

          if [ ! -f "$HANDLER_PATH" ]; then
            echo "::error::Build output not found at $HANDLER_PATH."
            exit 1
          fi

          BYTES=$(gzip -c "$HANDLER_PATH" | wc -c)
          RAW_BYTES=$(stat -c%s "$HANDLER_PATH")
          SIZE_MB=$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')
          RAW_MB=$(awk -v b="$RAW_BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')

          echo "Raw size     : $RAW_MB MB"
          echo "Gzipped size : $SIZE_MB MB ($BYTES bytes)"
          echo "Limit        : $MAX_WORKER_MB MB (Workers Paid; the free plan caps at 3 MB)"

          if awk -v s="$SIZE_MB" -v m="$MAX_WORKER_MB" 'BEGIN { exit !(s >= m) }'; then
            echo "::error::Worker exceeds the $MAX_WORKER_MB MB gzipped limit and will be rejected by Cloudflare."
            exit 1
          fi
          echo "Within limit."

      - name: Deploy Worker to Cloudflare
        run: npx wrangler deploy

      - name: Set Worker runtime secrets
        run: |
          set -euo pipefail
          printf '%s' "${PAYLOAD_SECRET}" | npx wrangler secret put PAYLOAD_SECRET
          for name in NOTIFY_TELEGRAM_BOT_TOKEN NOTIFY_TELEGRAM_CHAT_ID NOTIFY_ADMIN_URL; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "::notice::$name is not set; skipping."
            fi
          done
      - name: Smoke-check the deployed CMS
        run: |
          set -euo pipefail
          if [ -z "${CMS_URL:-}" ]; then
            echo "::notice::Set the CMS_URL secret to enable the post-deploy smoke check."
            exit 0
          fi

          CMS_URL="$(printf '%s' "$CMS_URL" | tr -d '[:space:]')"
          CMS_URL="${CMS_URL%%,*}"
          CMS_URL="${CMS_URL%/}"
          fail=0
          for path in /admin "/api/globals/header" "/api/page?limit=1" "/api/capability?limit=1"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$CMS_URL$path")
            echo "GET $path -> $code"
            if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
              echo "::error::$path returned $code."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

          pages=$(curl -sL --retry 3 "$CMS_URL/api/page?limit=1&depth=0" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).totalDocs||0)}catch{console.log(0)}})')
          echo "Pages in production: $pages"
          if [ "$pages" = "0" ]; then
            echo "::error::The deployed CMS has no pages. Run npm run sync:db -- --yes locally first."
            exit 1
          fi

          media=$(curl -sL --retry 3 "$CMS_URL/api/media?limit=1&depth=0" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log((JSON.parse(s).docs[0]||{}).url||"")}catch{console.log("")}})')
          if [ -n "$media" ]; then
            code=$(curl -sL -o /dev/null -w '%{http_code}' --retry 3 "$CMS_URL$media")
            echo "GET $media -> $code"
            [ "$code" = "200" ] || { echo "::error::Media is not served from R2. Run npm run sync:media -- --yes locally."; exit 1; }
          fi
          echo "CMS content and media are live."
